# pode_foundation config template.
#
# Every `pode foundation <command>` reads one of these YAML files via
# --config. Unset (null) fields fall back to the defaults baked into
# pode_foundation/config.py -- see that file for the authoritative schema.
# Fields you don't need for a given command are simply ignored by it.
#
# See configs/foundation/config.example.yaml for a filled-in worked example
# that runs end to end against the toy data generated by
# examples/foundation/generate_toy_methylation.py.

matrix:
  # Beta (or M-value) matrix: a wide CSV/TSV/TSV.gz or Parquet file, OR a
  # preprocessed .npy from `pode foundation preprocess`.
  path: null
  # samples_by_features: rows=samples, columns=probes (most exported CSVs).
  # features_by_samples: rows=probes, columns=samples (minfi/raw array exports).
  orientation: samples_by_features
  scale: beta                      # beta | m_value (controls model.output_activation choice below)
  feature_id_column: null          # header column name if the file isn't index_col=0 already

# `pode foundation preprocess` -- QC filter + genomic LD-pruning of `matrix.path`
# down to a fixed, approximately-independent probe set for pretraining.
preprocess:
  annotation_path: null            # CSV with Name/chr/pos (or IlmnID/chromosome/MAPINFO) columns
  n_keep: 50000                    # final probe count after pruning
  n_candidates: 200000             # top-N by SD considered as pruning candidates
  r_thresh: 0.5                    # |Pearson r| above which a genomic neighbour is pruned
  window_bp: 1000                  # genomic window (bp) searched for correlated neighbours
  epic_overlap_path: null          # optional: one-column probe-ID CSV to restrict candidates to
  cross_reactive_path: null        # optional: one-column probe-ID CSV of cross-reactive probes to drop
  output_dir: outputs/foundation/preprocess

# The MAE architecture. Applies to pretrain, finetune, and embed (embed reads
# the architecture from the checkpoint itself, so this mainly matters for
# pretrain/finetune).
model:
  encoder_dims: [1024, 512]        # encoder hidden layer widths; decoder mirrors them
  latent_dim: 256                  # embedding dimensionality
  dropout: 0.2
  output_activation: sigmoid       # sigmoid for beta scale (0-1); linear if matrix.scale is m_value

# `pode foundation pretrain` -- train a MethylationMAE from scratch. Also
# serves as the Stage-1 trainer when x_path points at a combined broad
# reference corpus (see pretrain_stage1 below).
training:
  mask_ratio: 0.15                 # fraction of probes hidden per training step
  batch_size: 64
  epochs: 100
  patience: 10                     # early-stop after this many epochs with no val improvement
  lr: 0.0001
  weight_decay: 0.0001
  val_frac: 0.1
  val_mask_draws: 3                # mask realisations averaged per validation batch
  num_workers: 0
  amp: false                       # mixed precision (only takes effect on CUDA)
  seed: 42
  device: auto                     # auto | cpu | cuda | cuda:N
  output_dir: outputs/foundation/pretrain
  # Optional: up-weight reconstruction error on a chosen subset of probes
  # (e.g. a locus of known relevance to your tumour type). `path` is a
  # boolean .npy mask aligned to the training feature set; weight=1.0 is a
  # no-op (plain flat MSE). Leave path null to skip this entirely.
  prognostic_weight:
    path: null
    weight: 1.0

# `pode foundation combine` + the Stage-1 pass of `pode foundation pretrain`.
# EXPERIMENTAL -- upstream marks this "written, not run": the alignment logic
# is sound but the full broad-reference pretraining run it enables has not
# itself been evaluated end to end. Off by default; only relevant if you're
# sourcing a broad public reference corpus yourself before fine-tuning onto
# your own cohort. If you don't have/want a broader reference, skip this
# entirely and just run `pretrain` directly on your own cohort.
pretrain_stage1:
  enabled: false
  combine:
    tcga_glob: null                # e.g. "TCGA-*.methylation450.tsv.gz" -- wide TSV.gz sources
    tcga_dir: null
    geo_dir: null                  # directory of <series>/betas.parquet sources
    feature_ids_path: null         # fixed feature set both stages align to (from `preprocess`)
    chunk_size: 25000
  output_dir: outputs/foundation/stage1

# `pode foundation finetune` -- Stage-2 domain-adaptive fine-tune of a Stage-1
# (or any prior) checkpoint onto your own cohort. This is the "pretrain
# broad, then adapt to my cohort" step; skip it (enabled: false) if you
# trained directly on your own cohort with `pretrain` and have nothing to
# fine-tune from.
finetune_stage2:
  enabled: false
  init_ckpt: null                  # checkpoint from `pretrain` (Stage-1 or otherwise)
  lr: 0.00001                      # typically ~10x lower than training.lr
  epochs: 50
  patience: 20
  output_dir: outputs/foundation/stage2

# `pode foundation survival` -- optional benchmark of embeddings (or a direct
# encoder fine-tune) against a survival endpoint. Off by default: your core
# ask is a pretrained/fine-tuned MAE and its embeddings, not a survival
# report. Turn this on once you have a clinical/phenotype CSV to evaluate
# against.
survival:
  enabled: false
  clinical_path: null              # CSV with at least id/time/event columns
  id_column: sample_id
  time_column: null
  event_column: null
  fold_column: null                # optional pre-computed CV fold column; auto stratified-K-fold if unset
  n_folds: 5
  seed: 42
  mode: frozen                     # frozen (fast, embeddings + lifelines Cox) | finetune (torch, encoder+head)
  penalizer: 0.1                   # frozen mode: lifelines CoxPHFitter regularisation strength
  l1_ratio: 0.5                    # frozen mode: elastic-net mix (0=ridge, 1=lasso)
  finetune_mode: partial           # finetune mode: frozen | partial | full (which encoder layers train)
  finetune_epochs: 100
  head_lr: 0.001
  encoder_lr: 0.00001
  output_dir: outputs/foundation/survival

# `pode foundation embed` -- apply a checkpoint's frozen encoder to a beta matrix.
embed:
  feature_ids_path: null           # feature_ids.npy from `preprocess` / used to train the checkpoint
  output_path: outputs/foundation/embeddings.csv
