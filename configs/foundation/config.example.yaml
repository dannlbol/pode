# Worked example: runs end to end against the toy fixtures generated by
# examples/foundation/generate_toy_methylation.py. Tiny epoch counts and
# hidden dims so the whole pipeline finishes on a CPU in seconds -- this is a
# smoke-test config, not a starting point for real training (see
# config.template.yaml for a realistic-scale template with every field
# documented).
#
# Try it:
#   python examples/foundation/generate_toy_methylation.py
#   pode foundation preprocess --config configs/foundation/config.example.yaml
#   pode foundation pretrain   --config configs/foundation/config.example.yaml
#   pode foundation embed      --config configs/foundation/config.example.yaml \
#       --ckpt outputs/foundation_example/pretrain/mae_best.pt
#   pode foundation survival   --config configs/foundation/config.example.yaml \
#       --embeddings outputs/foundation_example/embeddings.csv

matrix:
  path: examples/foundation/toy_beta.csv
  orientation: samples_by_features
  scale: beta

preprocess:
  annotation_path: examples/foundation/toy_annotation.csv
  n_keep: 200
  n_candidates: 500
  r_thresh: 0.5
  window_bp: 1000
  output_dir: outputs/foundation_example/preprocess

model:
  encoder_dims: [64, 32]
  latent_dim: 8
  dropout: 0.1
  output_activation: sigmoid

training:
  mask_ratio: 0.15
  batch_size: 8
  epochs: 3
  patience: 3
  lr: 0.001
  val_frac: 0.2
  val_mask_draws: 2
  seed: 42
  device: cpu
  output_dir: outputs/foundation_example/pretrain

finetune_stage2:
  lr: 0.0005
  epochs: 2
  patience: 2
  output_dir: outputs/foundation_example/stage2

survival:
  clinical_path: examples/foundation/toy_phenotype.csv
  id_column: sample_id
  time_column: time
  event_column: event
  fold_column: fold
  mode: frozen
  output_dir: outputs/foundation_example/survival

embed:
  feature_ids_path: outputs/foundation_example/preprocess/feature_ids.npy
  output_path: outputs/foundation_example/embeddings.csv
