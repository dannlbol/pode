# Worked example against the toy fixtures from
# examples/mantis/generate_toy_mantis_inputs.py. Exercises prepare-beta,
# prepare-survival, and generate-config's logic end to end WITHOUT needing
# R/Bioconductor, the external MANTIS environment, or a real reference-repo
# checkout -- this is a plumbing smoke test, not a real inference run (see
# docs/mantis/README.md for that).
#
# Try it:
#   python examples/mantis/generate_toy_mantis_inputs.py
#   pode mantis prepare-beta      --config configs/mantis/config.example.yaml
#   pode mantis prepare-survival  --config configs/mantis/config.example.yaml \
#       --sample-order outputs/mantis_example/beta/beta_sample_order.txt
#   pode mantis generate-config   --config configs/mantis/config.example.yaml \
#       --cohort toy_cohort \
#       --beta outputs/mantis_example/beta/beta_numeric.csv \
#       --cnv  examples/mantis/toy_cnv_numeric.csv \
#       --surv outputs/mantis_example/survival/survival.csv

beta:
  cohort_path: examples/mantis/toy_beta.csv
  orientation: samples_by_features
  cpg_order_path: examples/mantis/toy_cpg_order.txt
  training_means_path: examples/mantis/toy_training_means.csv
  output_dir: outputs/mantis_example/beta

survival:
  clinical_path: examples/mantis/toy_clinical.csv
  id_column: patient_id
  time_column: os_time
  event_column: os_event
  pfs_time_column: pfs_time
  pfs_event_column: pfs_event
  metastasis_column: metastasis
  output_dir: outputs/mantis_example/survival

reference_config:
  endpoint: os
  fixed_sections_from: examples/mantis/toy_reference_config.yaml
  output_path: outputs/mantis_example/mantis_config.yaml

inference:
  # A placeholder path -- doesn't need to exist for this toy example, which only
  # exercises config *generation*, not a real inference run (see docs/mantis/README.md
  # for that, which needs the real released checkpoint).
  model_weights_path: examples/mantis/toy_model_weights.pt
  output_predictions_path: outputs/mantis_example/predictions.csv
