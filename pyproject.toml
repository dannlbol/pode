[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pode"
version = "0.1.0"
description = "Pediatric Oncology Discovery Engine - data-agnostic synthetic clinical data generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PODE" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "lifelines>=0.27",
    "tqdm>=4.65",
    "threadpoolctl>=3.1",
    # Heavy synthesizer backend - required for generation/tuning but not for
    # schema/data wrangling utilities, which import them lazily.
    "sdv>=1.0",
    "sdmetrics>=0.10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5"]
# Backends for the synthvae omics front end. These are already satisfied by the
# core dependencies above; the extras mirror the standalone synthvae install
# profiles so `pip install pode[vae]` / `[sdv]` / `[survival]` / `[all]` still work.
vae = ["torch>=2.0"]
sdv = ["sdv>=1.0"]
survival = ["lifelines>=0.27"]
# Per-theme install profiles. Like the synthvae extras above, these are already
# satisfied by the core dependencies; they document the minimal footprint each
# suite theme needs and let `pip install pode[signatures]` / `[prognosis]` read
# as intent. See docs/DEFERRED.md for the planned lean-core dependency split.
signatures = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
signatures-advanced = ["scikit-survival==0.24.1"]
# `pode synthesis augment` (Coxnet, Uno C, td-AUC, IPCW Brier); same pin as signatures-advanced.
augmentation = ["scikit-survival==0.24.1"]
prognosis = ["lifelines>=0.27", "matplotlib>=3.7", "seaborn>=0.12"]
# `pode federated`: Opacus supplies the DP-SGD privacy accountant (only needed
# with dp.enabled); scikit-survival for the benchmark's utility metrics.
federated = ["opacus>=1.5,<2", "scikit-survival==0.24.1"]
# mantis wraps a THIRD-PARTY published model (MANTIS-MB) whose own dependencies
# (sparselinear, torch-scatter, torch-sparse, scikit-survival==0.23.1 -- which
# conflicts with the signatures-advanced pin above) cannot coexist with PODE's
# own environment. pode_mantis itself only needs the core deps already listed
# above; it drives the reference model via subprocess in a SEPARATE, externally
# managed environment (see docs/mantis/README.md). Do not add MANTIS's own deps
# here -- that would break `signatures-advanced` and PODE's Python floor.
mantis = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0"]
foundation = ["torch>=2.0", "lifelines>=0.27", "numpy>=1.24", "pandas>=2.0", "pyarrow"]
all = ["torch>=2.0", "sdv>=1.0", "lifelines>=0.27", "seaborn>=0.12"]

[project.scripts]
pode = "pode.cli.main:main"
# Back-compat alias for the standalone metaCpG-func console script. The primary
# surface is `pode signatures ...`; this keeps `metacpg-py ...` working.
metacpg-py = "metacpg.cli:main"

[tool.setuptools.packages.find]
include = ["pode*", "synthvae*", "metacpg*", "prognostk*", "pode_mantis*", "pode_foundation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
